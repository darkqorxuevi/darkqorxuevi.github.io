<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rəylər - DARK Horror House</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        :root { --bg: #030303; --surface: #0a0a0a; --primary: #d90000; --text: #ffffff; --border: #222222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .topbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(3,3,3,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; border-bottom: 1px solid var(--border); }
        .topbar-title { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; margin: 0 auto; padding-left: 28px; }
        .back-btn { font-size: 24px; color: var(--text); text-decoration: none; position: absolute; left: 20px; }
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; padding-top: 100px; }
        .review-item { background: var(--surface); padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 3px solid var(--primary); font-size: 14px; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back-btn">‹</a>
        <div class="topbar-title">Bütün Rəylər</div>
    </div>
    <div class="app-container" id="allReviews">
        <p style="text-align:center; color: #888;">Yüklənir...</p>
    </div>
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzC2Or58ry4WSpllHfM58eG_gmFa5A4LGjv-NUnrT_Rk4mnm5BopssJ30q8YuOeaX9X/exec';
        window.onload = async function() {
            const div = document.getElementById("allReviews");
            try {
                const res = await fetch(`${scriptURL}?action=read`);
                const data = await res.json();
                div.innerHTML = data.map(r => `<div class="review-item"><strong>${r.name}</strong><p style="color:#888; margin-top:5px;">${r.text}</p></div>`).join('');
                if(data.length === 0) div.innerHTML = "<p style='text-align:center;'>Hələ rəy yoxdur.</p>";
            } catch(e) { div.innerHTML = "<p style='text-align:center; color:red;'>Xəta baş verdi!</p>"; }
        };
    </script>
</body>
</html>
