<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nəticələr - DARK Horror House</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        :root { --bg: #030303; --surface: #0a0a0a; --primary: #d90000; --text: #ffffff; --border: #222222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .topbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(3,3,3,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; border-bottom: 1px solid var(--border); }
        .topbar-title { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; margin: 0 auto; padding-left: 28px; }
        .back-btn { font-size: 24px; color: var(--text); text-decoration: none; position: absolute; left: 20px; }
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; padding-top: 100px; }
        .result-card { background: var(--surface); padding: 15px 20px; border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .result-card span.score { font-weight: 800; color: var(--primary); font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back-btn">‹</a>
        <div class="topbar-title">Nəticələr</div>
    </div>
    <div class="app-container">
        <div class="result-card">
            <div>
                <strong>1. Komanda Alfa</strong><br>
                <span style="font-size: 12px; color: #888;">Məktəb 11 / 10A</span>
            </div>
            <span class="score">98 Xal</span>
        </div>
        <div class="result-card">
            <div>
                <strong>2. Qorxusuzlar</strong><br>
                <span style="font-size: 12px; color: #888;">Gimnaziya / 11B</span>
            </div>
            <span class="score">85 Xal</span>
        </div>
        <div class="result-card">
            <div>
                <strong>3. Kölgə</strong><br>
                <span style="font-size: 12px; color: #888;">Məktəb 4 / 9C</span>
            </div>
            <span class="score">74 Xal</span>
        </div>
    </div>
</body>
</html>
