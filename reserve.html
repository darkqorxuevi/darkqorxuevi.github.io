<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rezervasiya - DARK Horror House</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        :root { --bg: #030303; --surface: #0a0a0a; --primary: #d90000; --text: #ffffff; --border: #222222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .topbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(3,3,3,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; border-bottom: 1px solid var(--border); }
        .topbar-title { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; margin: 0 auto; padding-left: 28px; }
        .back-btn { font-size: 24px; color: var(--text); text-decoration: none; position: absolute; left: 20px; }
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; padding-top: 100px; }
        
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 12px; color: #888; font-weight: 600; }
        .step-indicator span { display: flex; align-items: center; gap: 5px; }
        .step-indicator .active { color: var(--primary); }
        .step-indicator .active::before { content: ''; display: inline-block; width: 20px; height: 20px; background: var(--primary); color: white; border-radius: 50%; text-align: center; line-height: 20px; }
        
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #ccc; }
        select, input { width: 100%; padding: 15px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin-bottom: 20px; outline: none; font-size: 14px; }
        .btn { width: 100%; background: var(--primary); color: #fff; padding: 16px; border: none; border-radius: 8px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back-btn">‹</a>
        <div class="topbar-title">Rezervasiya</div>
    </div>
    <div class="app-container">
        <div class="step-indicator">
            <span class="active">1. Tarix</span>
            <span>2. Oyun</span>
            <span>3. Qrup</span>
        </div>
        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Rezervasiya sistemi işə salındı!'); window.location.href='index.html';">
            <label>Tarix seçin</label>
            <input type="date" required>
            <label>Oyun seçin</label>
            <select required>
                <option value="">Seçin...</option>
                <option>Qanlı Mənzil</option>
                <option>Psixoloq</option>
                <option>Mqam</option>
                <option>Dəhliz</option>
            </select>
            <label>İştirakçı sayı</label>
            <select required>
                <option value="">Seçin...</option>
                <option>2 nəfər</option>
                <option>3 nəfər</option>
                <option>4 nəfər</option>
                <option>5+ nəfər</option>
            </select>
            <button type="submit" class="btn">Davam et →</button>
        </form>
    </div>
</body>
</html>
