<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yarışma Qeydiyyatı - DARK Horror House</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        :root { --bg: #030303; --surface: #0a0a0a; --primary: #d90000; --text: #ffffff; --border: #222222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .topbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(3,3,3,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; border-bottom: 1px solid var(--border); }
        .topbar-title { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; margin: 0 auto; padding-left: 28px; }
        .back-btn { font-size: 24px; color: var(--text); text-decoration: none; position: absolute; left: 20px; }
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; padding-top: 100px; text-align: center; }
        .hero-img { width: 100%; height: 180px; background: url('https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=600&q=80') center/cover; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        input { width: 100%; padding: 15px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin-bottom: 15px; outline: none; font-size: 14px; }
        .btn { width: 100%; background: var(--primary); color: #fff; padding: 16px; border: none; border-radius: 8px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back-btn">‹</a>
        <div class="topbar-title">Yarışma Qeydiyyatı</div>
    </div>
    <div class="app-container">
        <div class="hero-img"></div>
        <h2 style="font-size: 1.2rem; margin-bottom: 10px; color: var(--primary);">Daha çox həyəcan!</h2>
        <p style="font-size: 13px; color: #888; margin-bottom: 25px; padding: 0 10px;">Siniflər arası yarışmada iştirak edərək xüsusi hədiyyələr qazan.</p>
        
        <form onsubmit="event.preventDefault(); alert('Qeydiyyat uğurla tamamlandı!'); window.location.href='index.html';">
            <input type="text" placeholder="Komanda adı" required>
            <input type="text" placeholder="Məktəb / Sinif" required>
            <input type="tel" placeholder="Əlaqə nömrəsi" required>
            <button type="submit" class="btn">Qeydiyyat</button>
        </form>
    </div>
</body>
</html>
