<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oyunlarımız - DARK Horror House</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        :root { --bg: #030303; --surface: #0a0a0a; --surface-light: #141414; --primary: #d90000; --text: #ffffff; --text-muted: #888888; --border: #222222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        .topbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(3,3,3,0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; border-bottom: 1px solid var(--border); }
        .topbar-title { font-weight: 800; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin: 0 auto; padding-left: 28px; }
        .burger { font-size: 28px; cursor: pointer; color: var(--text); transition: 0.3s; }
        .burger.close { transform: rotate(90deg); color: var(--primary); }
        .back-btn { font-size: 24px; color: var(--text); text-decoration: none; position: absolute; left: 20px; }

        .side-menu { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 99; transition: right 0.4s; display: flex; flex-direction: column; padding-top: 90px; }
        .side-menu.active { right: 0; }
        .side-menu a { padding: 15px 30px; font-size: 16px; font-weight: 600; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; padding-top: 90px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .game-card { background: var(--surface-light); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: fadeIn 0.8s ease forwards; text-align: center; padding-bottom: 15px; transition: 0.3s; }
        .game-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
        .game-img { width: 100%; height: 160px; background: #222; object-fit: cover; border-bottom: 2px solid var(--primary); }
        .game-title { font-size: 14px; font-weight: 800; text-transform: uppercase; margin: 15px 0 10px 0; color: var(--text); }
        .game-details { display: flex; justify-content: space-around; font-size: 12px; color: var(--text-muted); margin-bottom: 15px; }
        .game-details span { display: flex; align-items: center; gap: 5px; }
        .game-details span i { color: var(--primary); font-style: normal; }
        .btn-small { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
        .btn-small:hover { background: var(--primary); color: #fff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="index.html" class="back-btn">‹</a>
        <div class="topbar-title">Oyunlarımız</div>
        <div class="burger" onclick="toggleMenu()" id="burger">☰</div>
    </div>

    <div class="side-menu" id="menu">
        <a href="index.html">Ana Səhifə</a>
        <a href="about.html">Haqqımızda</a>
        <a href="rejimler.html">Rejimlər</a>
        <a href="reyler.html">Sizin rəyləriniz</a>
    </div>

    <!-- Scalable Game System -->
    <div class="app-container">
        
        <div class="game-card">
            <div class="game-img" style="background: url('https://images.unsplash.com/photo-1518133501309-840616b24d77?auto=format&fit=crop&w=400&q=80') center/cover;"></div>
            <div class="game-title">Qanlı Mənzil</div>
            <div class="game-details">
                <span><i>👥</i> 2-6 nəfər</span>
                <span><i>⏱</i> 60 dəq</span>
            </div>
            <a href="reserve.html" class="btn-small">Rezervasiya</a>
        </div>

        <div class="game-card">
            <div class="game-img" style="background: url('https://images.unsplash.com/photo-1505635552518-3448ff116af3?auto=format&fit=crop&w=400&q=80') center/cover;"></div>
            <div class="game-title">Psixoloq</div>
            <div class="game-details">
                <span><i>👥</i> 2-8 nəfər</span>
                <span><i>⏱</i> 60 dəq</span>
            </div>
            <a href="reserve.html" class="btn-small">Rezervasiya</a>
        </div>

        <div class="game-card">
            <div class="game-img" style="background: url('https://images.unsplash.com/photo-1473876637954-4b533e46c764?auto=format&fit=crop&w=400&q=80') center/cover;"></div>
            <div class="game-title">Mqam</div>
            <div class="game-details">
                <span><i>👥</i> 2-6 nəfər</span>
                <span><i>⏱</i> 60 dəq</span>
            </div>
            <a href="reserve.html" class="btn-small">Rezervasiya</a>
        </div>

        <div class="game-card">
            <div class="game-img" style="background: url('https://images.unsplash.com/photo-1519502685987-2c974dd13045?auto=format&fit=crop&w=400&q=80') center/cover;"></div>
            <div class="game-title">Dəhliz</div>
            <div class="game-details">
                <span><i>👥</i> 2-8 nəfər</span>
                <span><i>⏱</i> 60 dəq</span>
            </div>
            <a href="reserve.html" class="btn-small">Rezervasiya</a>
        </div>

    </div>

    <script>
        function toggleMenu(){
            const menu = document.getElementById("menu");
            const burger = document.getElementById("burger");
            menu.classList.toggle("active");
            if(menu.classList.contains("active")){ burger.innerHTML = "✕"; burger.classList.add("close"); } 
            else { burger.innerHTML = "☰"; burger.classList.remove("close"); }
        }
    </script>
</body>
</html>
